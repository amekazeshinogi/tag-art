name: Keep Supabase Alive

on:
  schedule:
      # 3日ごとに実際に書き込む(SELECTだけではアクティビティとしてカウントされないため)
          - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Update heartbeat row (real write, counts as activity)
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            -X PATCH \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
            "https://eoademoyfyopqfnljhyf.supabase.co/rest/v1/heartbeat?id=eq.1"
