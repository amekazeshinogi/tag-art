name: Keep Supabase Alive

on:
  schedule:
    # 6日ごとに実行（Supabase無料プランは7日で自動停止するため）
    - cron: '0 3 */6 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (real table query)
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            -H "apikey: sb_publishable_KuwA-05ihmrblfTcxAK2LQ_D7bepSL-" \
            -H "Authorization: Bearer sb_publishable_KuwA-05ihmrblfTcxAK2LQ_D7bepSL-" \
            "https://eoademoyfyopqfnljhyf.supabase.co/rest/v1/profiles?select=id&limit=1"

