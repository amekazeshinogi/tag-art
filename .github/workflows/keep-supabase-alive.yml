name: Keep Supabase Alive

on:
  schedule:
    # 6日ごとに実行（Supabase無料プランは7日で自動停止するため）
    - cron: '0 3 */6 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "https://eoademoyfyopqfnljhyf.supabase.co/auth/v1/health"
